name: CI & Security Gates

on:
  push:
    branches: [main, master, "gov/*", "feat/*", "fix/*"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server Checks (tsc + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        run: cd server && npm ci
      - name: Server Typecheck (tsc)
        run: cd server && npx tsc --noEmit
      - name: Server Unit Tests
        run: cd server && npm test

  frontend:
    name: Frontend Checks (tsc + strict + lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Frontend Standard Typecheck (tsc)
        run: cd frontend && npx tsc -p tsconfig.app.json --noEmit
      - name: Frontend Strict Core Typecheck (tsconfig.strict.json)
        run: cd frontend && npx tsc -p tsconfig.strict.json --noEmit
      - name: Frontend Linter (oxlint)
        run: cd frontend && npm run lint
      - name: Frontend Unit Tests (vitest)
        run: cd frontend && npm test
      - name: Frontend Production Build
        run: cd frontend && npm run build

  desktop:
    name: Desktop Checks (tsc + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        run: cd desktop && npm ci
      - name: Desktop Typecheck (tsc)
        run: cd desktop && npx tsc --noEmit
      - name: Desktop Build
        run: cd desktop && npm run build:ts

  guards:
    name: Static Security & Quality Guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Guards Baseline Verification
        run: node scripts/guards.mjs

  audit:
    name: Dependency Audit (Blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit Server Dependencies
        run: cd server && npm audit --omit=dev --audit-level=high
      - name: Audit Frontend Dependencies
        run: cd frontend && npm audit --omit=dev --audit-level=high
      - name: Audit Desktop Dependencies
        run: cd desktop && npm audit --omit=dev --audit-level=high

  gitleaks:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-build:
    name: Windows Packaging & Installer Verification
    runs-on: windows-latest
    timeout-minutes: 25
    needs: [server, frontend, desktop]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            server/package-lock.json
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install desktop dependencies
        run: cd desktop && npm ci

      - name: Build Server
        run: cd server && npm run build

      - name: Build Frontend
        run: cd frontend && npm run build

      - name: Package Desktop Windows Installer
        run: |
          cd desktop
          npm run build
          npm run compile:bytecode
          npm run package:win

      - name: Upload Windows Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: context-os-windows-installer
          path: desktop/release/*.exe
          if-no-files-found: warn
          retention-days: 7

