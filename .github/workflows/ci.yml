name: CI & Security Gates

on:
  push:
    branches: [main, master, "gov/*", "feat/*", "fix/*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server Checks (tsc + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        run: cd server && npm ci
      - name: Server Typecheck (tsc)
        run: cd server && npx tsc --noEmit
      - name: Server Unit Tests
        run: cd server && npm test

  frontend:
    name: Frontend Checks (tsc + strict + lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Frontend Standard Typecheck (tsc)
        run: cd frontend && npx tsc -p tsconfig.app.json --noEmit
      - name: Frontend Strict Core Typecheck (tsconfig.strict.json)
        run: cd frontend && npx tsc -p tsconfig.strict.json --noEmit
      - name: Frontend Linter (oxlint)
        run: cd frontend && npm run lint
      - name: Frontend Unit Tests (vitest)
        run: cd frontend && npm test
      - name: Frontend Production Build
        run: cd frontend && npm run build

  desktop:
    name: Desktop Checks (tsc + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        run: cd desktop && npm ci
      - name: Desktop Typecheck (tsc)
        run: cd desktop && npx tsc --noEmit
      - name: Desktop Build
        run: cd desktop && npm run build:ts

  guards:
    name: Static Security & Quality Guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run Guards Baseline Verification
        run: node scripts/guards.mjs

  audit:
    name: Dependency Audit (Blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Audit Server Dependencies
        run: cd server && npm audit --omit=dev --audit-level=high
      - name: Audit Frontend Dependencies
        run: cd frontend && npm audit --omit=dev --audit-level=high
      - name: Audit Desktop Dependencies
        run: cd desktop && npm audit --omit=dev --audit-level=high

  gitleaks:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-build:
    name: Windows Packaging & Installer Verification
    runs-on: windows-latest
    timeout-minutes: 25
    needs: [server, frontend, desktop]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            server/package-lock.json
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install desktop dependencies
        run: cd desktop && npm ci

      - name: Build Server
        run: cd server && npm run build

      - name: Build Frontend
        run: cd frontend && npm run build

      - name: Package Desktop Windows Installer
        run: |
          cd desktop
          npm run build
          npm run compile:bytecode
          npm run package:win -- --publish never

      - name: Smoke Test - Run Silent Installer & Verify Bundled Git
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path desktop/release/*.exe | Select-Object -First 1
          if (-not $installer) {
            throw "Instalador .exe não foi encontrado em desktop/release/"
          }
          Write-Host "Executando instalador silencioso: $($installer.FullName)..."
          Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait
          
          # Aguardar breve momento para garantir término do processo do NSIS
          Start-Sleep -Seconds 5
          
          $installDir = "$env:LOCALAPPDATA\Programs\Context OS"
          Write-Host "Verificando instalação em: $installDir"
          if (-not (Test-Path $installDir)) {
            throw "Diretório de instalação não encontrado: $installDir"
          }
          
          $appExe = Join-Path $installDir "Context OS.exe"
          if (-not (Test-Path $appExe)) {
            throw "Executável Context OS.exe não encontrado em $appExe!"
          }
          Write-Host "✅ Context OS.exe instalado com sucesso!"
          
          $gitExe = Join-Path $installDir "resources\git\cmd\git.exe"
          if (-not (Test-Path $gitExe)) {
            throw "MinGit embutido não encontrado em $gitExe!"
          }
          Write-Host "✅ MinGit embutido encontrado com sucesso!"
          
          $gitVersion = & $gitExe --version
          Write-Host "Versão do Git: $gitVersion"
          
          # Validar se o Git executa init sem dependências externas
          $testRepo = Join-Path $env:TEMP "smoke-test-repo"
          & $gitExe init $testRepo
          Write-Host "✅ Git init executado com sucesso no Windows sem Git pré-instalado!"

      - name: Upload Windows Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: context-os-windows-installer
          path: desktop/release/*.exe
          if-no-files-found: warn
          retention-days: 7


